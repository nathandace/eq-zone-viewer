# Builds the self-contained releases and attaches them to the GitHub release for a tag.
# Push a tag such as v0.2.0 to trigger it, or run it by hand from the Actions tab.
# Windows is the primary target; the macOS and Linux builds are best effort and do not fail the run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            required: true
          - os: macos-latest
            name: macos
            required: false
          - os: ubuntu-latest
            name: linux
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check that package.json matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json is $v but the tag is ${GITHUB_REF_NAME}; run 'npm version <x.y.z> --no-git-tag-version' and retag" >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: eq-zone-viewer-${{ matrix.name }}
          path: release/*.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          generate_release_notes: true
